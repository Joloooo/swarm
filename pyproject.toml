[project]
name = "swarmattacker"
version = "0.1.1"
description = "Multi-methodology swarm penetration testing agent built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Zviad Jolokhava", email = "zviadjolokhava@gmail.com" }
]
keywords = [
    "penetration-testing",
    "security",
    "llm",
    "agent",
    "langgraph",
    "web-application-security",
    "autonomous-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "langchain>=1.2",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "playwright>=1.40",
    "pydantic>=2.0",
    "libtmux>=0.40",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiofiles>=23.0",
    "python-nmap>=0.7.1",
    "langgraph-cli[inmem]>=0.2",
    # Interactive `swarm` CLI — questionary for arrow-key menus,
    # rich for the banner / spinners / panels, tomlkit for round-
    # tripping ``swarm-config.toml`` without nuking user comments.
    "questionary>=2.0",
    "rich>=13.0",
    "tomlkit>=0.13",
    "markdownify>=1.2.2",
    "beautifulsoup4>=4.15.0",
    # Branded real-target penetration-test reports.
    "reportlab>=4.2",
]

[project.urls]
Homepage = "https://github.com/Joloooo/swarm"
Repository = "https://github.com/Joloooo/swarm"
Issues = "https://github.com/Joloooo/swarm/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# By default skip the heavy tiers. Run them explicitly with:
#   uv run pytest -m tools     # tier 3: shell out to real binaries
#   uv run pytest -m live      # tier 4: hit a real LLM (costs tokens)
addopts = "-m 'not tools and not live'"
markers = [
    "tools: tier-3 smoke tests that shell out to external binaries (nmap, ssh, ...)",
    "live: tier-4 tests that hit a real LLM API — opt-in only",
]

[project.scripts]
# ``swarm`` is the new primary CLI — interactive TUI with no args,
# benchmark shortcuts via flags, legacy natural-language one-shot
# when given a positional. ``swarmattacker`` is kept as an alias
# for backwards compatibility (same dispatcher, same module).
swarm         = "src.cli:main"
swarmattacker = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Keep the source distribution lean: ship only what a `pip install` needs.
# The repo root also holds multi-GB artefacts (logs/, the xbow-validation/
# submodule, benchmarks/) and the 135 MB wordlists/ tree — none of which
# belong in a PyPI sdist (and wordlists are fetched by scripts/ on demand).
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "requirements.lock.txt",
    "swarm-config.toml",
]

[tool.uv.sources]
